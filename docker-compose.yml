services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: tennis-admin-web
    ports:
      - "9999:9999"
    env_file:
      - path: .env.local
        required: false
    environment:
      PORT: "9999"
      HOSTNAME: "0.0.0.0"
      WATCHPACK_POLLING: "true"
      # 로컬 Supabase CLI(supabase start) 사용 시 호스트 연결
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://host.docker.internal:54321}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 프로덕션 빌드 실행: docker compose --profile prod up --build
  web-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: tennis-admin-web-prod
    ports:
      - "9999:9999"
    env_file:
      - path: .env.local
        required: false
    environment:
      PORT: "9999"
      HOSTNAME: "0.0.0.0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  node_modules:
