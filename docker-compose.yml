services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: tennis-admin-web
    ports:
      - "8899:8899"
    env_file:
      - path: env.docker
        required: true
    environment:
      PORT: "8899"
      HOSTNAME: "0.0.0.0"
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 프로덕션 빌드 실행: docker compose --profile prod up --build
  web-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: tennis-admin-web-prod
    ports:
      - "8899:8899"
    env_file:
      - path: env.docker
        required: false
      - path: .env.local
        required: false
    environment:
      PORT: "8899"
      HOSTNAME: "0.0.0.0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  node_modules:
